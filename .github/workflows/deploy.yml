name: Deploy Static Gallery to GitHub Pages (AFG-01)

on:
  push:
    branches:
      - main

# Global permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    # Force strict local permissions context for Node 24 runners
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Upgraded to v5 to officially support Node 24 environments
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upgraded to v3 (latest sub-version) for stable artifact packaging
      - name: Upload Artifacts from dist folder
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: './dist'

      # Upgraded to v4 (latest sub-version) to fully clear exit code 2 errors on Node 24
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
